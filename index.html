  <style>

      --text:#f8fafc;--muted:#aab5c8;--red:#e32636;--red2:#ff4656;--white:#fff;
      --green:#25d366;--ink:#111827;--soft:#f3f5f8;--shadow:0 22px 60px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
    a{text-decoration:none;color:inherit}button{font:inherit}a,button{touch-action:manipulation}img,svg{max-width:100%}
    .wrap{width:min(1120px,calc(100% - 28px));margin:auto}
    .top{position:sticky;top:0;z-index:40;background:rgba(10,15,30,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}

    .lang-btn.active{background:#fff;color:#111827}
    .topwa{padding:11px 13px;border-radius:12px;background:var(--green);font-weight:900;font-size:13px;color:#07130c;white-space:nowrap}
    .hero{padding:28px 0 20px}.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:20px;align-items:stretch}
    .hero-main{padding:40px;border-radius:30px;background:radial-gradient(circle at 90% 0%,rgba(227,38,54,.28),transparent 32%),linear-gradient(145deg,#131d35,#0d1427 65%);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden}
    .eyebrow{display:inline-flex;gap:8px;align-items:center;padding:8px 11px;border-radius:999px;background:rgba(227,38,54,.13);border:1px solid rgba(255,70,86,.28);font-size:12px;font-weight:900;color:#ffbdc4;text-transform:uppercase;letter-spacing:.8px}
    h1{font-size:54px;line-height:.98;letter-spacing:-2.2px;margin:18px 0 16px;max-width:720px}h1 .accent{color:#ff4b5a}

    .point{padding:13px 14px;border-radius:16px;background:rgba(255,255,255,.055);border:1px solid var(--line);font-size:13px;font-weight:800}.point b{color:#fff}.point span{color:#9da8bb}
    .hero-actions{display:flex;gap:10px;flex-wrap:wrap}.btn{min-height:54px;border:0;border-radius:15px;padding:14px 18px;font-weight:950;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
    .btn-red{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;box-shadow:0 12px 28px rgba(227,38,54,.25)}.btn-ghost{background:rgba(255,255,255,.06);color:#fff;border:1px solid var(--line)}

    .hero-side h2{font-size:26px;letter-spacing:-.8px;margin:18px 0 8px}.hero-side p{color:#667085;line-height:1.45;margin:0}.choice-note{font-size:12px;color:#7b8494;margin-top:14px}
    .split{padding:30px 0}.section-head{margin-bottom:18px}.section-head small{color:#ff707c;font-weight:900;letter-spacing:1.5px;text-transform:uppercase}

    .paths{display:grid;grid-template-columns:1fr 1fr;gap:14px}.path{border-radius:28px;padding:26px;border:1px solid var(--line);background:var(--card);position:relative;overflow:hidden}
    .path.employee{background:linear-gradient(155deg,#16213b,#10182c)}.path.partner{background:linear-gradient(155deg,#34151a,#171523)}
    .path-tag{display:inline-block;padding:8px 10px;border-radius:999px;font-weight:900;font-size:11px;background:rgba(255,255,255,.09)}
    .path h3{font-size:30px;line-height:1.05;letter-spacing:-.8px;margin:18px 0 10px}.path p{color:#b8c2d3;line-height:1.5}
    .checks{display:grid;gap:9px;margin:18px 0 22px}.check{display:flex;gap:9px;align-items:flex-start;color:#e9edf5;font-size:13px}.check i{font-style:normal;width:21px;height:21px;border-radius:50%;background:rgba(37,211,102,.16);color:#6de79b;display:grid;place-items:center;font-weight:900;flex:0 0 21px}
    .path .btn{width:100%}.employee .btn{background:#fff;color:#111827}.partner .btn{background:var(--green);color:#07130c}
    .trust{background:#fff;color:var(--ink);padding:34px 0}.trust-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.trust-card{background:var(--soft);border-radius:20px;padding:20px}.trust-card b{display:block;font-size:17px;margin-bottom:7px}.trust-card p{margin:0;color:#687386;font-size:13px;line-height:1.5}
    .how{padding:38px 0}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.step{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px}.n{width:38px;height:38px;border-radius:12px;background:rgba(227,38,54,.17);color:#ff7884;display:grid;place-items:center;font-weight:950;margin-bottom:15px}.step b{display:block;font-size:18px;margin-bottom:7px}.step p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
    .safe{padding:0 0 38px}.safe-box{background:#0f6c45;border-radius:28px;padding:28px;display:grid;grid-template-columns:1.25fr .75fr;gap:18px;align-items:center}.safe h2{font-size:32px;margin:0 0 9px}.safe p{margin:0;color:#d8f3e6;line-height:1.5}.safe-list{display:grid;gap:8px}.safe-pill{background:rgba(255,255,255,.10);padding:11px 13px;border-radius:14px;font-size:12px;font-weight:850}
    details{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px 18px;margin-bottom:9px}summary{font-weight:900;cursor:pointer}details p{color:var(--muted);line-height:1.5;font-size:13px}
    .legal{background:#070b15;border-top:1px solid var(--line);padding:28px 0 100px;color:#8995aa;font-size:12px;line-height:1.55}.legal-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.legal b{color:#d8dee9}
    .sticky{position:fixed;z-index:60;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:720px;margin:auto;padding:8px;background:rgba(255,255,255,.96);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.3);display:grid;grid-template-columns:1fr 1fr;gap:8px}.sticky a{min-height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:950;font-size:13px}.sticky .job{background:#111827;color:#fff}.sticky .biz{background:var(--green);color:#06130b}
    @media(max-width:900px){
      .topwa{display:none}
      .hero-grid{grid-template-columns:1fr}
      .hero-side{min-height:0}
      .paths{grid-template-columns:1fr}
      .trust-grid,.steps{grid-template-columns:1fr}
      .safe-box{grid-template-columns:1fr}
      .legal-grid{grid-template-columns:1fr}
    }
    @media(max-width:780px){
      .wrap{width:min(calc(100% - 20px),680px)}
      .top{padding-top:env(safe-area-inset-top)}

      .point{padding:12px 13px}
      .hero-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
      .hero-actions .btn{width:100%;padding:13px 11px;text-align:center;line-height:1.2}
      .hero-side{border-radius:23px;padding:18px}
      .trailer-art{min-height:158px;border-radius:18px}
      .hero-side h2{font-size:24px;margin-top:15px}
      .split,.how{padding:27px 0}
      .section-head{margin-bottom:15px}
      .section-head h2{font-size:29px;letter-spacing:-1px}

      .path .btn{white-space:normal;text-align:center;line-height:1.2}
      .trust{padding:28px 0}
      .trust-card{padding:18px}
      .step{padding:18px}
      .safe-box{padding:21px 18px;border-radius:22px}
      .safe h2{font-size:28px}
      details{padding:15px 16px}
      summary{line-height:1.3}
      .legal{padding:24px 0 104px}
      .sticky{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));padding:7px;border-radius:16px;gap:7px}
      .sticky a{min-height:48px;padding:9px 7px;text-align:center;line-height:1.15;font-size:12.5px;white-space:normal}
    }
    @media(max-width:430px){
      .hero-actions{grid-template-columns:1fr}
      .hero-actions .btn{min-height:50px}
      .section-head h2{font-size:28px}
      .path h3{font-size:25px}
      .safe h2{font-size:27px}
    }
    @media(max-width:360px){
      .wrap{width:calc(100% - 16px)}
      .topin{min-height:56px;gap:6px}
      .brand{font-size:16px;gap:6px}
      .brand-mark{width:32px;height:32px;flex-basis:32px;border-radius:8px}
      .brand-mark svg{width:23px;height:23px}
      .lang-switch{padding:2px;border-radius:9px}

      .trailer-art{min-height:140px}
      .hero-side h2{font-size:22px}
      .section-head h2{font-size:26px}
      .path{padding:18px 15px}
      .path h3{font-size:23px}
      .path-tag{font-size:10px}
      .check{font-size:12.5px}
      .safe-box{padding:18px 15px}

      .sticky a{font-size:11.5px;padding-left:5px;padding-right:5px}
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap topin">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64"><path d="M10 38h31l7 8h7v7h-6a9 9 0 0 1-18 0H22a9 9 0 0 1-18 0H2v-8h8z" fill="white"/><path d="M15 18h25l6 17H15z" fill="none" stroke="white" stroke-width="5" stroke-linejoin="round"/></svg>
        </span>
        <span>KazPricep<small data-i18n="brand_sub"></small></span>
      </a>
      <div class="top-actions">
        <div class="lang-switch" aria-label="Language">
          <button type="button" class="lang-btn" data-lang="ru">RU</button>
          <button type="button" class="lang-btn" data-lang="kk">ҚАЗ</button>
        </div>
        <a class="topwa" data-wa="general" href="#">WhatsApp</a>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="wrap hero-grid">
        <div class="hero-main">
          <div class="eyebrow" data-i18n="eyebrow"></div>
          <h1 data-i18n-html="hero_title"></h1>
          <p class="lead" data-i18n="hero_lead"></p>
          <div class="hero-points">
            <div class="point"><b data-i18n="job"></b><br><span data-i18n="job_short"></span></div>
            <div class="point"><b data-i18n="partnership"></b><br><span data-i18n="partner_short"></span></div>
          </div>
          <div class="hero-actions">
            <a class="btn btn-red" href="#formats" data-i18n="choose_format"></a>
            <a class="btn btn-ghost" href="https://kpricep.com/" target="_blank" rel="noopener" data-i18n="about_company"></a>
          </div>
        </div>

        <aside class="hero-side">
          <div class="trailer-art" aria-hidden="true">
            <svg viewBox="0 0 700 330">
              <defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#343c4b"/><stop offset="1" stop-color="#111827"/></linearGradient></defs>
              <path d="M96 74h376l63 145H96z" fill="url(#g)"/><path d="M118 96h330l35 80H118z" fill="#e9edf3"/><path d="M535 219h74l46 15-4 18h-118z" fill="#9aa3b1"/><path d="M64 219h488v37H64z" fill="#e32636"/><circle cx="170" cy="260" r="43" fill="#161b24"/><circle cx="170" cy="260" r="20" fill="#c8ced7"/><circle cx="440" cy="260" r="43" fill="#161b24"/><circle cx="440" cy="260" r="20" fill="#c8ced7"/><path d="M651 239h40" stroke="#2f3744" stroke-width="12" stroke-linecap="round"/>
            </svg>
          </div>
          <div>
            <h2 data-i18n="two_paths"></h2>
            <p data-i18n="no_long_form"></p>
            <div class="choice-note" data-i18n="conditions_note"></div>
          </div>
        </aside>
      </div>
    </section>

    <section class="split" id="formats">
      <div class="wrap">
        <div class="section-head">
          <small data-i18n="choose_direction"></small>
          <h2 data-i18n="different_formats"></h2>
          <p data-i18n="separated_for_relevance"></p>
        </div>

        <div class="paths">
          <article class="path employee">
            <span class="path-tag" data-i18n="looking_job"></span>
            <h3 data-i18n="job_heading"></h3>
            <p data-i18n="job_desc"></p>
            <div class="checks">
              <div class="check"><i>✓</i><span data-i18n="job_check1"></span></div>
              <div class="check"><i>✓</i><span data-i18n="job_check2"></span></div>
              <div class="check"><i>✓</i><span data-i18n="job_check3"></span></div>
            </div>
            <a class="btn" data-wa="job" href="#" data-i18n="job_wa"></a>
          </article>

          <article class="path partner">
            <span class="path-tag" data-i18n="commercial_partner"></span>
            <h3 data-i18n="has_ip_kaspi"></h3>
            <p data-i18n="partner_desc"></p>
            <div class="checks">
              <div class="check"><i>✓</i><span data-i18n="partner_check1"></span></div>
              <div class="check"><i>✓</i><span data-i18n="partner_check2"></span></div>
              <div class="check"><i>✓</i><span data-i18n="partner_check3"></span></div>
            </div>
            <a class="btn" data-wa="partner" href="#" data-i18n="partner_wa"></a>
          </article>
        </div>
      </div>
    </section>

    <section class="trust">
      <div class="wrap">
        <div class="section-head">
          <small style="color:#d92535" data-i18n="clear_first"></small>
          <h2 data-i18n="no_easy_money"></h2>
          <p style="color:#697586" data-i18n="no_guarantees"></p>
        </div>
        <div class="trust-grid">
          <div class="trust-card"><b data-i18n="current_terms"></b><p data-i18n="current_terms_desc"></p></div>
          <div class="trust-card"><b data-i18n="for_ip_only"></b><p data-i18n="for_ip_desc"></p></div>
          <div class="trust-card"><b data-i18n="no_access"></b><p data-i18n="no_access_desc"></p></div>
        </div>
      </div>
    </section>

    <section class="how">
      <div class="wrap">
        <div class="section-head"><small data-i18n="how_start"></small><h2 data-i18n="three_steps"></h2></div>
        <div class="steps">
          <div class="step"><div class="n">1</div><b data-i18n="step1"></b><p data-i18n="step1_desc"></p></div>
          <div class="step"><div class="n">2</div><b data-i18n="step2"></b><p data-i18n="step2_desc"></p></div>
          <div class="step"><div class="n">3</div><b data-i18n="step3"></b><p data-i18n="step3_desc"></p></div>
        </div>
      </div>
    </section>

    <section class="safe">
      <div class="wrap safe-box">
        <div><h2 data-i18n="safety"></h2><p data-i18n="safety_desc"></p></div>
        <div class="safe-list">
          <div class="safe-pill" data-i18n="safe1"></div>
          <div class="safe-pill" data-i18n="safe2"></div>
          <div class="safe-pill" data-i18n="safe3"></div>
        </div>
      </div>
    </section>

    <section class="how" id="faq">
      <div class="wrap">
        <div class="section-head"><small data-i18n="questions"></small><h2 data-i18n="important"></h2></div>
        <details><summary data-i18n="faq1q"></summary><p data-i18n="faq1a"></p></details>
        <details><summary data-i18n="faq2q"></summary><p data-i18n="faq2a"></p></details>
        <details><summary data-i18n="faq3q"></summary><p data-i18n="faq3a"></p></details>
        <details><summary data-i18n="faq4q"></summary><p data-i18n="faq4a"></p></details>
      </div>
    </section>
  </main>

  <footer class="legal">
    <div class="wrap legal-grid">
      <div><b>KazPricep</b><br><span data-i18n="footer_company"></span> <a href="https://kpricep.com/" target="_blank" rel="noopener" style="color:#d8dee9;text-decoration:underline">kpricep.com</a>.</div>
      <div><b data-i18n="privacy"></b><br><span data-i18n="privacy_desc"></span></div>
    </div>

      window.__SITE_LANG=lang;
      document.documentElement.lang=lang==='kk'?'kk':'ru';
      document.documentElement.classList.toggle('lang-kk',lang==='kk');
      document.documentElement.classList.toggle('lang-ru',lang==='ru');
      const t=dict[lang];
      document.title=t.title;
      document.getElementById('metaDescription').setAttribute('content',t.meta);
      document.querySelectorAll('[data-i18n]').forEach(el=>{
        const k=el.dataset.i18n; if(t[k]!=null)el.textContent=t[k];
      });
      document.querySelectorAll('[data-i18n-html]').forEach(el=>{
        const k=el.dataset.i18nHtml; if(t[k]!=null)el.innerHTML=t[k];
      });
      document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));

        document.cookie='site_lang='+lang+'; Path=/; Max-Age=31536000; SameSite=Lax; Secure';
